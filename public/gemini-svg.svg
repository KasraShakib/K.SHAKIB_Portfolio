<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- گرادینت پس‌زمینه تاریک -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- گرادینت رنگی بنفش/نیلی برای لوگو -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- درخشش نئونی -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- پس‌زمینه مربعی با گوشه‌های گرد -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-width="8" stroke-opacity="0.3"/>

  <!-- آیکون کد / نماد فرانت‌اند < KS > -->
  <g filter="url(#glow)">
    <!-- علامت سمت چپ > -->
    <path d="M 120 180 L 60 256 L 120 332" fill="none" stroke="url(#primary-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- حرف K S و ساختار لوگو -->
    <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="210" fill="#ffffff" text-anchor="middle" letter-spacing="-8">KS</text>
    
    <!-- علامت سمت راست < -->
    <path d="M 392 180 L 452 256 L 392 332" fill="none" stroke="url(#primary-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
